<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página não encontrada | Pedras Tricordiana</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/style.css">
<style>
.erro{min-height:100vh;display:grid;grid-template-columns:1fr 1fr;background:var(--terra);color:var(--claro-txt)}
.erro__txt{display:flex;flex-direction:column;justify-content:center;padding:48px clamp(16px,6vw,90px)}
.erro__txt img{width:140px;margin-bottom:48px}
.erro__num{font-family:var(--display);font-stretch:65%;font-weight:900;font-size:clamp(5rem,14vw,10rem);line-height:.85;color:var(--ouro);margin:0 0 16px}
.erro__txt p{color:var(--claro-sub);max-width:28em}
.erro__foto{background:url(/assets/img/tex-quartzito.jpg) center/cover}
.erro__acoes{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px}
@media (max-width:760px){.erro{grid-template-columns:1fr}.erro__foto{min-height:200px;order:-1}}
</style>
</head>
<body>
<main class="erro">
  <div class="erro__txt">
    <img src="/assets/img/logo-claro.svg" alt="Pedras Tricordiana" width="156" height="53">
    <p class="erro__num">404</p>
    <h1 class="h2">Essa página não existe</h1>
    <p>O endereço pode ter mudado ou foi digitado errado. As pedras continuam todas na página inicial.</p>
    <div class="erro__acoes">
      <a class="btn btn--ouro" href="/">Ir para a página inicial</a>
      <a class="btn btn--linha" href="https://wa.me/5535999798434" target="_blank" rel="noopener">Falar no WhatsApp</a>
    </div>
  </div>
  <div class="erro__foto" role="img" aria-label="Textura de Quartzito São Tomé"></div>
</main>
</body>
</html>
